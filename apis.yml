- aid: emissary-ingress:emissary-ingress-gateway-api
  name: Emissary-Ingress Gateway API
  description: >-
    Emissary-Ingress supports a subset of the Kubernetes Gateway API standard, including GatewayClass,
    Gateway, and HTTPRoute resources. This enables teams to use the next-generation Kubernetes ingress
    standard for defining routing rules, with support for path matching, header matching, and weighted
    load balancing across backend services.
  humanURL: https://emissary-ingress.dev/docs/3.8/topics/using/gateway-api/
